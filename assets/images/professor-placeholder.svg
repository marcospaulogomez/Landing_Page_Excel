  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <circle cx="200" cy="140" r="65" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <path d="M90 350 C90 240, 310 240, 310 350 Z" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
